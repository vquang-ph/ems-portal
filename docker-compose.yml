services:
  db:
    image: postgres:15
    container_name: ems_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${APP_DATABASE_NAME}
      POSTGRES_USER: ${APP_DATABASE_USER}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD}
    ports:
      - "${APP_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_DATABASE_USER} -d ${APP_DATABASE_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: ems_portal_backend
    ports:
      - "3000:3000"
    environment:
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 3306
      APP_DATABASE_USER: ${APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
      APP_DATABASE_NAME: ${APP_DATABASE_NAME}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        APP_BACKEND_URL: ${APP_BACKEND_URL}
    container_name: ems_portal_frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
