databases:
  - name: ems-portal-db
    databaseName: ems_portal
    user: ems_portal_user
    plan: free

services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: ems-portal-backend
    runtime: docker
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_RUN_MIGRATIONS
        value: true
      - key: APP_RUN_SEEDS
        value: true
      # Render routes traffic to PORT=10000 by default; this must match.
      - key: APP_BACKEND_PORT
        value: 10000
      - key: APP_SWAGGER_ENABLED
        value: false
      - key: APP_FRONTEND_URL
        value: https://ems-portal-frontend.onrender.com

      # Database — Render injects the connection string from the managed DB above
      - key: APP_DATABASE_URL
        fromDatabase:
          name: ems-portal-db
          property: connectionString

      # Auth — auto-generated secret; set TTLs to taste
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: APP_REFRESH_EXPIRES_IN
        value: 7d
      - key: APP_REFRESH_COOKIE_NAME
        value: ems.refresh
      - key: APP_REFRESH_COOKIE_SECURE
        value: true
      # APP_REFRESH_COOKIE_DOMAIN: leave unset unless frontend & backend are on different subdomains

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: ems-portal-frontend
    runtime: docker
    dockerfilePath: ./packages/frontend/Dockerfile
    dockerContext: .
    plan: free
    # The Dockerfile hardcodes `serve -l 3001` but Render expects PORT=10000.
    # This override makes serve bind to Render's port.
    dockerCommand: serve -s dist -l 10000
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      # Render passes env vars as Docker build args when the Dockerfile has a matching ARG.
      # The frontend Dockerfile declares ARG APP_BACKEND_URL, so this is baked into the Vite bundle at build time.
      - key: APP_BACKEND_URL
        value: https://ems-portal-backend-e4mp.onrender.com
